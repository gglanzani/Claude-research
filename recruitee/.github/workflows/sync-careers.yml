name: Sync Careers Page

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'recruitee/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recruitee

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build generator
        run: go build -o generator ./cmd/generate

      - name: Fetch vacancies and generate site
        run: ./generator

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status output --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git commit -m "chore: update careers page with latest vacancies"
          git push

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: careers-site
          path: recruitee/output/
          retention-days: 7
